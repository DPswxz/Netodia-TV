name: Regenerate dependency lockfile

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Update the zip dependency resolution
        run: cargo update -p zip --precise 9.0.4
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regenerated-cargo-lock
          path: Cargo.lock
          retention-days: 1
