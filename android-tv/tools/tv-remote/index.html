<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>电视镜像遥控器</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17191e;color:#f4f5f7;font:15px -apple-system,BlinkMacSystemFont,sans-serif}header{padding:22px 28px;display:flex;align-items:center;gap:20px}h1{font-size:21px;margin:0}#status{color:#a8b2c1;font-size:13px}main{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:22px;padding:0 28px 28px}.screen{align-self:start;background:#000;border:1px solid #353942;border-radius:12px;overflow:hidden;aspect-ratio:16/9;display:flex;align-items:center}.screen canvas{cursor:pointer;touch-action:none;display:block;width:100%;height:100%;object-fit:contain}.remote{background:#242831;border:1px solid #383e49;border-radius:25px;padding:22px 18px}.brand{text-align:center;letter-spacing:3px;color:#a6b1c2;font-size:12px;margin:0 0 22px}button{border:1px solid #4b5361;background:#343b48;color:#fff;border-radius:12px;font:inherit;min-height:45px;cursor:pointer;touch-action:manipulation}button:hover{background:#485467}button:active,.pressed{background:#60cdff!important;color:#10202a;transform:scale(.96)}button:focus-visible{outline:2px solid #60cdff;outline-offset:3px}.dpad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:20px 0}.dpad button{height:61px;font-size:22px}.dpad .ok{background:#60cdff;color:#14242d;font-size:17px;font-weight:600}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.pair{grid-template-columns:repeat(2,1fr)}.launch{width:100%;margin-top:15px;background:#244b60;border-color:#397695}p{font-size:12px;line-height:1.7;color:#a8b2c1;margin:20px 0 0}#notice{color:#60cdff;min-height:20px;font-size:12px;text-align:center;margin-top:12px}@media(max-width:800px){main{grid-template-columns:1fr}.remote{max-width:330px;justify-self:center;width:100%}header{display:block}#status{display:block;margin-top:10px}}
</style>
<header><h1>电视镜像遥控器</h1><span id="status">正在连接电视…</span></header>
<main><div class="screen"><canvas id="screen" width="1280" height="720"></canvas></div><aside class="remote">
<div class="brand">NETODIA · TV REMOTE</div>
<div class="row"><button data-key="back">返回</button><button data-key="home">主页</button><button data-key="menu">菜单</button></div>
<div class="dpad"><span></span><button data-key="up" aria-label="上">▲</button><span></span><button data-key="left" aria-label="左">◀</button><button class="ok" data-key="ok">确定</button><button data-key="right" aria-label="右">▶</button><span></span><button data-key="down" aria-label="下">▼</button><span></span></div>
<div class="row"><button data-key="previous">上一首</button><button data-key="play">播放/暂停</button><button data-key="next">下一首</button></div>
<div class="row"><button data-key="volume_down">音量 −</button><button data-key="mute">静音</button><button data-key="volume_up">音量 +</button></div>
<button class="launch" id="launch">打开 Netodia TV</button><div id="notice"></div>

</aside></main>
<script>
const token='__TOKEN__',canvas=document.getElementById('screen'),status=document.getElementById('status'),notice=document.getElementById('notice');
let control,controlTimer,serial=0,videoTimer,lastRepeat=0;
const pending=new Map();
function send(key,point){
 if(!control||control.readyState!==WebSocket.OPEN){notice.textContent='遥控正在连接';return false;}
 if(control.bufferedAmount>4096){notice.textContent='网络繁忙';return false;}
 const id=++serial;
 pending.set(id,performance.now());
 if(pending.size>32)pending.delete(pending.keys().next().value);
 control.send(JSON.stringify({action:['tap','scroll','launch','resync'].includes(key)?key:'key',key,id,...point}));
 return true;
}
function connectControl(){
 control=new WebSocket('ws://'+location.host+'/control?token='+encodeURIComponent(token));
 control.onopen=()=>{notice.textContent='已连接';};
 control.onmessage=e=>{const result=JSON.parse(e.data);pending.delete(result.id);notice.textContent=result.ok?'':'操作失败：'+result.error;};
 control.onclose=()=>{pending.clear();notice.textContent='遥控正在重连';controlTimer=setTimeout(connectControl,400);};
}
document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('pointerdown',e=>{if(e.button===0){e.preventDefault();b.focus();send(b.dataset.key);}}));
document.getElementById('launch').onclick=()=>send('launch');
const keys={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'ok',Escape:'back',Backspace:'back',' ':'play'};
document.addEventListener('keydown',e=>{if(keys[e.key]){e.preventDefault();if(e.repeat){if(!e.key.startsWith('Arrow')||performance.now()-lastRepeat<90)return;}lastRepeat=performance.now();send(keys[e.key]);}});
function screenPoint(clientX,clientY){
 const rect=canvas.getBoundingClientRect(),scale=Math.min(rect.width/canvas.width,rect.height/canvas.height);
 const width=canvas.width*scale,height=canvas.height*scale,left=rect.left+(rect.width-width)/2,top=rect.top+(rect.height-height)/2;
 if(clientX<left||clientX>=left+width||clientY<top||clientY>=top+height)return null;
 return {x:Math.floor((clientX-left)/scale),y:Math.floor((clientY-top)/scale),width:canvas.width,height:canvas.height};
}
canvas.addEventListener('pointerdown',e=>{if(e.button===0){const point=screenPoint(e.clientX,e.clientY);if(point){e.preventDefault();send('tap',point);}}});
let wheelTimer,wheelY=0,wheelX=0,wheelPoint;
canvas.addEventListener('wheel',e=>{const point=screenPoint(e.clientX,e.clientY);if(!point)return;e.preventDefault();wheelPoint=point;wheelY+=e.deltaY;wheelX+=e.deltaX;if(!wheelTimer)wheelTimer=setTimeout(()=>{send('scroll',{...wheelPoint,vertical:-Math.max(-4,Math.min(4,wheelY/100)),horizontal:-Math.max(-4,Math.min(4,wheelX/100))});wheelY=wheelX=0;wheelTimer=null;},24);},{passive:false});
canvas.addEventListener('contextmenu',e=>{e.preventDefault();send('back');});
const ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
let video,decoder,pendingFrame,paintScheduled=false,waitingKey=true,codec='',lastResync=0,drawnFrames=0,totalPainted=0,statsTime=performance.now(),fps=0,droppedFrames=0;
function resync(){if(performance.now()-lastResync>1200){send('resync');lastResync=performance.now();}}
function avcCodec(bytes){
 for(let i=0;i+7<bytes.length;i++){
  let start=-1;
  if(bytes[i]===0&&bytes[i+1]===0&&bytes[i+2]===1)start=i+3;
  else if(bytes[i]===0&&bytes[i+1]===0&&bytes[i+2]===0&&bytes[i+3]===1)start=i+4;
  if(start>=0&&(bytes[start]&31)===7)return 'avc1.'+Array.from(bytes.subarray(start+1,start+4),v=>v.toString(16).padStart(2,'0')).join('');
 }
 return codec||'avc1.420028';
}
function configure(nextCodec){
 codec=nextCodec;
 try{decoder.configure({codec,optimizeForLatency:true,hardwareAcceleration:'prefer-software'});}
 catch(e){decoder.configure({codec,optimizeForLatency:true});}
}
function paint(){
 paintScheduled=false;
 if(!pendingFrame)return;
 const frame=pendingFrame;pendingFrame=null;
 try{if(canvas.width!==frame.displayWidth||canvas.height!==frame.displayHeight){canvas.width=frame.displayWidth;canvas.height=frame.displayHeight;}ctx.drawImage(frame,0,0);drawnFrames++;totalPainted++;}
 finally{frame.close();}
}
function closeVideo(){
 if(video){video.onclose=null;video.close();video=null;}
 if(decoder&&decoder.state!=='closed')decoder.close();
 if(pendingFrame){pendingFrame.close();pendingFrame=null;}
}
function connectVideo(){
 if(document.hidden)return;
 if(!('VideoDecoder' in window)){status.textContent='请用 Chrome 或 Edge 打开镜像';return;}
 closeVideo();waitingKey=true;
 decoder=new VideoDecoder({output:frame=>{if(pendingFrame){pendingFrame.close();droppedFrames++;}pendingFrame=frame;if(!paintScheduled){paintScheduled=true;requestAnimationFrame(paint);}},error:()=>{status.textContent='视频正在恢复';if(video)video.close();}});
 video=new WebSocket('ws://'+location.host+'/video?token='+encodeURIComponent(token));video.binaryType='arraybuffer';
 video.onmessage=e=>{
  if(e.data.byteLength<10)return;
  const bytes=new Uint8Array(e.data),key=bytes[0]===1,pts=Number(new DataView(e.data).getBigUint64(1)),data=bytes.subarray(9);
  if(decoder.state==='closed')return;
  if(decoder.decodeQueueSize>3){decoder.reset();waitingKey=true;droppedFrames++;resync();}
  if(waitingKey&&!key)return;
  try{if(key){const nextCodec=avcCodec(data);if(decoder.state!=='configured'||nextCodec!==codec)configure(nextCodec);waitingKey=false;}
   decoder.decode(new EncodedVideoChunk({type:key?'key':'delta',timestamp:pts,data}));
  }catch(e){waitingKey=true;resync();}
 };
 video.onclose=()=>{closeVideo();clearTimeout(videoTimer);videoTimer=setTimeout(connectVideo,300);};
}
document.addEventListener('visibilitychange',()=>{clearTimeout(videoTimer);if(document.hidden)closeVideo();else connectVideo();});
async function refresh(){
 try{const s=await(await fetch('/status')).json();if(s.serverId&&s.serverId!==token.slice(0,8)){location.reload();return;}
  const now=performance.now();fps=Math.round(drawnFrames*1000/(now-statsTime));drawnFrames=0;statsTime=now;
  status.textContent=s.error||(totalPainted?'已连接 · '+canvas.width+' × '+canvas.height+' · '+(fps?fps+' fps':'画面静止'):'正在接收画面');
 }catch(e){status.textContent='服务未连接';}
 setTimeout(refresh,1500);
}
window.addEventListener('pagehide',()=>{clearTimeout(controlTimer);clearTimeout(videoTimer);if(control){control.onclose=null;control.close();}closeVideo();});
connectControl();connectVideo();refresh();
</script></html>
